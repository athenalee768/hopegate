<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<title>課程說明｜中華希望之門文化協會</title>
<meta name="description" content="中華希望之門文化協會課程與活動說明。">
<link rel="icon" href="assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>[hidden]{display:none!important}</style>
<style>
/* Layout: 一條往上走的天空 — 從希望之門出發，先讀懂宗旨，再走進三大計畫、課程與報名。 */
:root{
  color-scheme:light;
  --sky-50:#f3f8fe; --sky-100:#e4f0fc; --sky-200:#c9e1f8; --sky-300:#9fc8f0;
  --sky-500:#4a8fd6; --sky-700:#1f5fa8; --navy:#1b2f4a; --ink:#2b3a4e; --muted:#5d6f85;
  --gold:#f2b929; --gold-soft:#fde7a4; --gold-deep:#a8730a; --err:#c94a30;
  --women:#e07b39; --family:#3c9a6b; --kids:#4a8fd6;
  --glass:rgba(255,255,255,.68); --glass-line:rgba(255,255,255,.92);
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --latin:'Cormorant Garamond',Georgia,serif;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{font-family:var(--sans);color:var(--ink);background:var(--sky-50);line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--serif);color:var(--navy);line-height:1.4;text-wrap:balance}
p{text-wrap:pretty}
:focus-visible{outline:3px solid var(--sky-500);outline-offset:3px;border-radius:6px}
section[id],article[id],header[id]{scroll-margin-top:86px}

.sky{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(60% 50% at 85% 10%, rgba(255,240,190,.55), transparent 60%),linear-gradient(180deg,#bcdcf7 0%,#dcecfb 45%,#f3f8fe 100%)}
.sky::before,.sky::after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(18px);background:#fff;opacity:.85}
.sky::before{width:46vw;height:16vw;left:-12vw;bottom:-5vw;box-shadow:24vw 2vw 0 -2vw #fff, 10vw -4vw 0 -3vw #fff}
.sky::after{width:38vw;height:13vw;right:-10vw;top:6%;box-shadow:-16vw 3vw 0 -3vw #fff;opacity:.7}
.wrap{width:min(1280px,100% - 40px);margin:0 auto;position:relative}
.narrow{max-width:820px}
section{padding-block:104px}
@media(max-width:720px){section{padding-block:68px}}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:19px;letter-spacing:.2em;color:var(--sky-700);font-weight:700;margin-bottom:16px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--gold)}
.h2{font-size:clamp(28px,3.6vw,44px);font-weight:700}
.lead{font-size:21px;color:var(--muted);margin-top:16px;max-width:700px}
.prose p{font-size:20px;color:var(--ink);margin-top:18px}
.prose p.em{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:21px}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--glass-line);border-radius:var(--r);box-shadow:0 18px 50px -20px rgba(31,95,168,.28), inset 0 1px 0 #fff}
.glow{box-shadow:0 0 0 1px rgba(242,185,41,.35),0 20px 60px -18px rgba(242,185,41,.55), inset 0 1px 0 #fff}
.photo{border-radius:var(--r);overflow:hidden;box-shadow:0 24px 60px -28px rgba(27,47,74,.55);border:4px solid #fff;background:var(--sky-100)}
.photo img{width:100%;height:100%;object-fit:cover}
.center{text-align:center}
.center .lead{margin-inline:auto}

/* NAV */
.announce{background:linear-gradient(90deg,var(--sky-700),#2a6fc4);color:#fff;text-align:center;font-size:17.5px;padding:8px 20px;position:relative;z-index:60}
.announce a{text-decoration:underline;color:var(--gold-soft)}
.nav{position:sticky;top:0;z-index:50;transition:.3s;padding-top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:84px}
.nav.scrolled{background:rgba(255,255,255,.88);box-shadow:0 6px 24px -14px rgba(27,47,74,.35)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:52px;width:auto;flex:none}
.brand b{font-family:var(--serif);font-size:22px;color:var(--navy);letter-spacing:.04em;display:block;line-height:1.2;white-space:nowrap}
.brand small{font-family:var(--latin);font-size:14px;letter-spacing:.16em;color:var(--sky-700);white-space:nowrap}
.nav ul{display:flex;gap:24px;list-style:none;font-size:19px;font-weight:500}
.nav ul a{opacity:.85;transition:.2s}
.nav ul a:hover{opacity:1;color:var(--sky-700)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:19px;padding:14px 30px;border-radius:999px;border:0;cursor:pointer;transition:.25s;white-space:nowrap}
.btn-gold{background:linear-gradient(180deg,#ffd257,var(--gold));color:#3b2a00;box-shadow:0 10px 26px -10px rgba(201,138,11,.8), inset 0 1px 0 rgba(255,255,255,.7)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-gold{position:relative;overflow:hidden;isolation:isolate}
.btn-gold::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 48%,transparent 66%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,62%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn-ghost{background:rgba(255,255,255,.8);color:var(--sky-700);border:1px solid #fff}
.btn-ghost:hover{background:#fff}
.btn-line{background:#06c755;color:#fff;box-shadow:0 10px 26px -12px rgba(6,140,60,.8)}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}
.nav .btn{padding:12px 26px;font-size:19px}
@media(max-width:1320px){.nav ul{display:none}}
@media(max-width:480px){.brand small{display:none}.brand img{height:40px}.brand b{font-size:15px;white-space:normal;line-height:1.25}.nav .btn{padding:9px 14px;font-size:15px}.nav .wrap{gap:10px}}

.nav .wrap{width:min(1560px,100% - 40px)}
.nav ul a{white-space:nowrap}
.sp{min-width:0}
@media(max-width:640px){.sp .en{font-size:21px;overflow-wrap:anywhere}}
/* HERO */
.hero{position:relative;overflow:hidden;isolation:isolate;padding-block:80px 150px;background:#cfe6fb}
.hero-bg{position:absolute;inset:0;z-index:0;background:url(assets/hero-wide.jpg) left center/cover no-repeat;transform-origin:var(--dx,20%) var(--dy,45%);animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero-fx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.hero-glow{position:absolute;left:var(--dx,20%);top:var(--dy,45%);width:var(--gs,420px);height:var(--gs,420px);margin:calc(var(--gs,420px) / -2) 0 0 calc(var(--gs,420px) / -2);border-radius:50%;background:radial-gradient(circle,rgba(255,250,225,.95) 0%,rgba(255,236,170,.55) 28%,rgba(255,236,170,0) 66%);mix-blend-mode:screen;animation:glow 5.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
.hero-rays{position:absolute;left:var(--dx,20%);top:var(--dy,45%);width:calc(var(--gs,420px) * 2.6);height:calc(var(--gs,420px) * 2.6);margin:calc(var(--gs,420px) * -1.3) 0 0 calc(var(--gs,420px) * -1.3);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,246,210,.55) 0deg 5deg,rgba(255,246,210,0) 5deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);mix-blend-mode:screen;opacity:.55;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spark{position:absolute;left:var(--dx,20%);top:var(--dy,45%);width:var(--sz,6px);height:var(--sz,6px);border-radius:50%;background:#fffbe6;box-shadow:0 0 10px 3px rgba(255,236,150,.9);opacity:0;animation:spark var(--t,6s) ease-in-out var(--d,0s) infinite}
@keyframes spark{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.4)}20%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translate(var(--x1),var(--y1)) scale(1)}}
.drift{position:absolute;border-radius:50%;background:#fff;filter:blur(26px);opacity:.55}
.drift.a{width:38vw;height:9vw;bottom:6%;left:-40vw;animation:drift 70s linear infinite}
.drift.b{width:28vw;height:7vw;top:12%;left:-30vw;opacity:.4;animation:drift 95s linear -40s infinite}
@keyframes drift{to{transform:translateX(150vw)}}
.hero::after{z-index:2}
.hero .wrap{z-index:3;position:relative}
.hero-copy > *{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero-copy > *:nth-child(2){animation-delay:.15s}
.hero-copy > *:nth-child(3){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(243,248,254,0) 30%,rgba(243,248,254,.62) 60%,rgba(243,248,254,.82) 100%),linear-gradient(0deg,var(--sky-50) 0%,rgba(243,248,254,0) 30%)}
.hero .wrap{z-index:3;display:grid;grid-template-columns:1fr 1.1fr}
.hero-copy{grid-column:2}
.hero h1{font-size:clamp(30px,3.9vw,52px);font-weight:900;letter-spacing:.02em;line-height:1.45}
.hero h1 em{font-style:normal;background:linear-gradient(180deg,transparent 62%,var(--gold-soft) 62%)}
.hero p{font-size:21px;color:var(--ink);margin:20px 0 0;max-width:540px}
@media(max-width:860px){
  .hero{padding:0 0 40px;background:var(--sky-50)}
  .hero::before{content:"";display:block;height:min(100vw,520px)}
  .hero-bg{bottom:auto;height:min(100vw,520px);background:url(assets/sky-door.jpg) center top/cover no-repeat}
  .hero-fx{bottom:auto;height:min(100vw,520px)}
  .hero::after{inset:0 0 auto 0;height:min(100vw,520px);background:linear-gradient(0deg,var(--sky-50) 0%,rgba(243,248,254,0) 30%)}
  .hero .wrap{grid-template-columns:1fr;margin-top:-50px}
  .hero-copy{grid-column:1}
}
.entry{position:relative;z-index:2;margin-top:-96px;padding-bottom:30px}
.entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.entry a.glass{display:grid;justify-items:center;text-align:center;gap:12px;padding:36px 24px 32px;transition:.25s;border-top:4px solid var(--c)}
.entry a.glass:hover{transform:translateY(-4px);box-shadow:0 26px 60px -22px rgba(31,95,168,.45), inset 0 1px 0 #fff}
.entry .ic{width:108px;height:108px;border-radius:32px;display:grid;place-items:center;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 16px 30px -14px var(--g2),inset 0 2px 0 rgba(255,255,255,.45);transform:rotate(-5deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.entry a.glass .ic{animation:bobtile 4s ease-in-out infinite}
.entry a.glass:nth-child(2) .ic{animation-delay:-1.3s}
.entry a.glass:nth-child(3) .ic{animation-delay:-2.6s}
@keyframes bobtile{0%,100%{translate:0 0}50%{translate:0 -8px}}
.entry a.glass:hover .ic{transform:rotate(5deg) scale(1.08)}
.entry .ic svg{width:70px;height:70px}
.entry h3{font-size:28px}
.entry p{font-size:19px;color:var(--muted);line-height:1.6}
.entry .more{font-size:18px;font-weight:700;color:var(--c)}
.entry-cta{display:flex;justify-content:center;margin-top:30px}
.entry-cta .btn{font-size:21px;padding:17px 52px}
@media(max-width:860px){.entry{margin-top:0}.entry-grid{grid-template-columns:1fr}.entry a.glass{grid-template-columns:auto 1fr;justify-items:start;text-align:left;gap:4px 18px;padding:20px}.entry .ic{grid-row:span 3;width:76px;height:76px;border-radius:24px}.entry .ic svg{width:50px;height:50px}}

/* ABOUT */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:start}
.about .tagline{font-family:var(--serif);font-weight:900;font-size:clamp(24px,2.8vw,34px);color:var(--navy);line-height:1.6;margin-top:6px}
.about .tagline span{display:block}
.about .tagline span:nth-child(2){color:var(--sky-700)}
.about .tagline span:nth-child(3){color:var(--gold-deep)}
.core3{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.core3 b{padding:8px 18px;border-radius:999px;background:#fff;border:1px solid var(--sky-200);font-family:var(--serif);color:var(--navy)}
.chain{padding:30px 28px;display:grid;gap:0}
.chain h3{font-size:21px;margin-bottom:14px}
.chain-step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;padding:12px 0;position:relative}
.chain-step:not(:last-child)::after{content:"";position:absolute;left:25px;top:62px;bottom:-12px;width:2px;background:linear-gradient(var(--gold),var(--sky-300))}
.chain-step .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;color:#5a3d00;background:radial-gradient(circle at 40% 35%,#fff6d0,#ffd257 60%,#f2b929)}
.chain-step b{font-family:var(--serif);color:var(--navy);font-size:20px;display:block}
.chain-step span{color:var(--muted);font-size:17.5px}
.extend{margin-top:22px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--serif);font-weight:700;color:var(--sky-700)}
.extend i{font-style:normal;color:var(--gold-deep)}
@media(max-width:900px){.about{grid-template-columns:1fr;gap:36px}}

.cert{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:48px;align-items:center;margin-top:80px;padding:36px 40px;background:#fff;border-radius:28px;box-shadow:0 24px 60px -30px rgba(27,47,74,.45);border:1px solid var(--sky-100)}
.cert-img{position:relative;display:block;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(27,47,74,.55);transform:rotate(-1.5deg);transition:transform .3s}
.cert-img:hover{transform:rotate(0) scale(1.02)}
.cert-img img{width:100%;height:auto}
.cert-img span{position:absolute;right:10px;bottom:10px;background:rgba(27,47,74,.8);color:#fff;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px}
.cert-badge{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#8a1f1f;background:#fdecea;border:1.5px solid #e9a39b;padding:6px 16px;border-radius:999px}
.cert-badge::before{content:"";width:12px;height:12px;border-radius:3px;background:#c8312b}
.cert-info h3{font-size:clamp(24px,2.6vw,32px);margin-top:14px}
.cert-info dl{display:grid;gap:12px;margin-top:22px}
.cert-info dl div{display:grid;grid-template-columns:5em 1fr;gap:14px;padding-bottom:12px;border-bottom:1px dashed var(--sky-200)}
.cert-info dt{font-weight:700;color:var(--gold-deep);font-size:18px}
.cert-info dd{font-size:clamp(18px,1.7vw,21px);font-weight:500;color:var(--navy)}
@media(max-width:860px){.cert{grid-template-columns:1fr;gap:26px;padding:24px 20px}.cert-img{max-width:340px;margin:0 auto}}
/* VISION */
.vision{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.vision .glass{padding:30px 26px;border-left:4px solid var(--c)}
.vision small{font-size:16px;letter-spacing:.18em;font-weight:700;color:var(--c)}
.vision h3{font-size:24px;margin-top:6px}
.vision-close{margin-top:36px;text-align:center;font-family:var(--serif);font-size:clamp(19px,2vw,23px);font-weight:700;color:var(--navy)}
@media(max-width:860px){.vision{grid-template-columns:1fr}}

/* PROGRAMS OVERVIEW */
.pgs{display:grid;gap:56px;margin-top:56px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;scroll-margin-top:90px}
.pg:nth-child(even) .pg-media{order:2}
.pg-media{aspect-ratio:4/3}
.pg-badge{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.pg-ic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 14px 26px -12px var(--g2),inset 0 2px 0 rgba(255,255,255,.45);transform:rotate(-5deg)}
.pg-ic svg{width:50px;height:50px}
.pg-no{display:inline-flex;align-items:baseline;gap:8px;padding:6px 20px 6px 18px;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:18px;letter-spacing:.08em;box-shadow:0 10px 20px -12px var(--c)}
.pg-no b{font-family:var(--latin);font-size:30px;line-height:1;letter-spacing:0}
.pg h3{font-size:clamp(22px,2.4vw,30px);margin-top:4px}
.pg .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pg .tags span{font-size:16.5px;font-weight:700;padding:5px 14px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff)}
.pg .prose p{font-size:19px}
.pg blockquote{margin-top:20px;padding:16px 20px;border-radius:14px;background:#fff;border-left:4px solid var(--c);font-family:var(--serif);font-weight:700;color:var(--navy)}
.pg .go{display:inline-flex;margin-top:20px;font-weight:700;color:var(--c);gap:6px}
@media(max-width:900px){.pg{grid-template-columns:1fr;gap:24px}.pg:nth-child(even) .pg-media{order:0}}

/* CYCLE */
.cycle{display:flex;align-items:stretch;gap:0;margin-top:48px;flex-wrap:wrap;justify-content:center}
.cyc{flex:1 1 150px;min-width:0;display:grid;justify-items:center;text-align:center;gap:10px;padding:0 6px;position:relative}
.cyc .orb{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.3;color:var(--navy);background:#fff;border:2px solid var(--sky-200);box-shadow:0 14px 30px -16px rgba(31,95,168,.6)}
.cyc:last-child .orb{background:radial-gradient(circle at 40% 35%,#fff6d0,#ffd257 60%,#f2b929);border-color:#ffe48a;color:#5a3d00}
.cyc:not(:last-child)::after{content:"";position:absolute;top:46px;left:calc(50% + 54px);right:calc(-50% + 54px);height:4px;border-radius:4px;background:linear-gradient(90deg,var(--sky-200) 0 30%,var(--gold) 45%,var(--sky-200) 60% 100%);background-size:300% 100%;animation:flow 2.8s linear infinite}
.cyc:nth-child(2)::after{animation-delay:.35s}.cyc:nth-child(3)::after{animation-delay:.7s}.cyc:nth-child(4)::after{animation-delay:1.05s}
@keyframes flow{from{background-position:100% 0}to{background-position:-200% 0}}
.cyc:last-child .orb{animation:pulseorb 2.8s ease-in-out infinite}
@keyframes pulseorb{0%,100%{box-shadow:0 0 0 0 rgba(255,214,90,.6),0 14px 30px -16px rgba(201,138,11,.8)}50%{box-shadow:0 0 0 14px rgba(255,214,90,0),0 14px 30px -16px rgba(201,138,11,.8)}}
.cyc p{font-size:17.5px;color:var(--muted);line-height:1.6;max-width:170px}
.cycle-note{margin-top:44px;text-align:center}
.cycle-note p{font-family:var(--serif);font-size:clamp(18px,2vw,22px);font-weight:700;color:var(--navy);max-width:760px;margin:0 auto}
@media(max-width:860px){.cycle{flex-direction:column;align-items:stretch;gap:18px}.cyc{grid-template-columns:72px 1fr;justify-items:start;text-align:left;align-items:center}.cyc .orb{width:72px;height:72px;font-size:18px}.cyc p{max-width:none}.cyc:not(:last-child)::after{left:35px;right:auto;top:76px;width:2px;height:18px}}

/* SPIRIT */
.spirit{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:48px}
.sp{padding:28px 20px;text-align:center;display:grid;gap:6px;align-content:start}
.sp .en{font-family:var(--latin);font-size:27px;font-weight:600;color:var(--sky-700);line-height:1.1}
.sp h3{font-size:22px}
.sp p{font-size:17.5px;color:var(--muted);line-height:1.65}

.signup-head h2{font-size:clamp(24px,2.4vw,32px);color:var(--sky-700);margin-top:22px;font-family:var(--sans);font-weight:700}
.signup-head p{color:var(--muted);margin-top:10px;font-size:20px}
.signup-photo{max-width:920px;margin:0 auto 28px;aspect-ratio:21/8}
.signup-photo img{object-position:center 30%}
.event{display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:36px;max-width:1280px;margin:0 auto 34px;align-items:start}
.poster{display:block;border-radius:var(--r);overflow:hidden;border:4px solid #fff;box-shadow:0 24px 60px -28px rgba(27,47,74,.6)}
.poster img{width:100%;height:auto}
.event-info{padding:40px 38px;display:grid;gap:16px;align-content:start}
.event-info .tagx{justify-self:start;font-family:var(--serif);font-weight:900;font-size:21px;padding:8px 22px;border-radius:999px;background:linear-gradient(180deg,#ffd257,var(--gold));color:#3b2a00}
.event-info h3{font-size:clamp(28px,3vw,40px);line-height:1.35;font-weight:900}
.event-info .slogan{font-family:var(--serif);color:var(--sky-700);font-weight:700;font-size:22px}
.event-info dl{display:grid;gap:14px;margin:8px 0}
.event-info dl div{display:grid;grid-template-columns:3.2em 1fr;gap:12px;padding-bottom:14px;border-bottom:1px dashed var(--sky-200)}
.event-info dt{font-weight:700;color:var(--gold-deep);font-size:21px}
.event-info dd{color:var(--navy);font-weight:500;font-size:22px;line-height:1.6}
.event-info .fine{font-size:17px;color:var(--muted);line-height:1.7}
.event-info .btn{justify-self:start;margin-top:6px;font-size:21px;padding:16px 40px}
#form-start{scroll-margin-top:80px}
@media(max-width:980px){.event{grid-template-columns:1fr}.poster{max-width:640px;margin:0 auto}}
@media(max-width:480px){.event-info{padding:26px 20px}.event-info dd{font-size:19px}.event-info dt{font-size:18px}.event-info .btn{font-size:18px;padding:14px 26px}}
.notice{max-width:920px;margin:0 auto 26px;padding:18px 24px;border-radius:18px;background:#fffaf0;border:2px solid #f2b929}
.notice h3{display:flex;align-items:center;gap:8px;font-size:20px;color:#7a4a00;margin-bottom:10px}
.notice ol{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.notice li{display:grid;grid-template-columns:22px 16px 1fr;align-items:start;gap:8px;font-size:16.5px;color:var(--navy);line-height:1.55}
.notice .mk{width:20px;height:20px;margin-top:3px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff}
.notice li.ok .mk{background:#2e9e62}
.notice li.no .mk{background:#d04a2f}
.notice li.no{color:#9a3420}
.notice .nm{font-weight:700;color:#a8730a;font-size:15px}
.notice .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.notice-foot{margin-top:10px;font-size:14.5px;color:#7a5a20}
@media(max-width:700px){.notice{padding:16px 16px}.notice ol{grid-template-columns:1fr}}
form.card{max-width:920px;margin:0 auto;padding:46px 50px}
.fs{border:0;margin-bottom:36px;min-width:0}
.fs legend{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--navy);margin-bottom:22px;display:flex;align-items:baseline;gap:12px}
.fs legend small{font-family:var(--latin);font-size:19px;color:var(--sky-500);font-style:italic}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.field{min-width:0}
.field label,.group-label{display:block;font-size:17.5px;font-weight:700;color:var(--navy);margin-bottom:8px}
.field label i,.group-label i{color:var(--err);font-style:normal;margin-left:3px}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:19px;color:var(--ink);padding:13px 16px;border-radius:12px;border:1px solid #c9dcf0;background:rgba(255,255,255,.9);outline:none;transition:.2s}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky-500);box-shadow:0 0 0 4px rgba(74,143,214,.15);background:#fff}
.err input,.err select{border-color:var(--err)!important}
.errmsg{display:block;color:var(--err);font-size:16.5px;margin-top:6px}
.errmsg:empty{display:none}
.group{margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips label{cursor:pointer;position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:1px solid #c9dcf0;background:rgba(255,255,255,.85);font-size:18px;transition:.18s;user-select:none}
.chips span::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid #9fb6cf;transition:.18s;flex:none}
.chips.multi span::before{border-radius:4px}
.chips input:checked+span{background:#fff6d6;border-color:var(--gold);color:#5a3d00;font-weight:700;box-shadow:0 6px 16px -10px rgba(201,138,11,.9)}
.chips input:checked+span::before{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 2.5px #fff6d6}
.chips input:focus-visible+span{outline:2px solid var(--sky-500);outline-offset:2px}
.group.err .chips span{border-color:var(--err)}
.form-foot{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px;text-align:center}
.form-foot .btn{font-size:21px;padding:16px 64px}
.form-foot small{color:var(--muted)}
.success,.gform{text-align:center;max-width:680px;margin:0 auto;padding:54px 44px}
.success img,.gform img{width:150px;margin:0 auto 18px}
.success h3,.gform h3{font-size:30px}
.success p,.gform p{color:var(--muted);margin:14px 0 26px;font-size:20px}
.gform ul{list-style:none;display:grid;gap:10px;text-align:left;margin:0 auto 28px;max-width:460px}
.gform li{padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.7);font-size:18px;color:var(--muted)}
.gform li b{color:var(--navy);margin-right:8px}
@media(max-width:720px){form.card{padding:30px 20px}.grid2{grid-template-columns:1fr}.success,.gform{padding:40px 22px}.signup-photo{aspect-ratio:16/9}}

.music-btn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;border:0;cursor:pointer;font:inherit;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4a8fd6,#1f5fa8);box-shadow:0 12px 28px -10px rgba(31,95,168,.8)}
.music-btn .note{display:inline-block}
.music-btn[aria-pressed="true"]{background:linear-gradient(135deg,#ffd257,#f2b929);color:#3b2a00}
.music-btn[aria-pressed="true"] .note{animation:notebob 1s ease-in-out infinite}
@keyframes notebob{50%{transform:translateY(-3px) rotate(-10deg)}}
.music-box{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;width:260px;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);border:3px solid #fff}
.music-box iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
@media(max-width:480px){.music-btn{right:12px;padding:10px 16px;font-size:15px}.music-box{right:12px;width:200px;bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
/* FOOTER */
footer{position:relative;padding:120px 0 40px;text-align:center;background:linear-gradient(180deg,var(--sky-50),#cfe5fa 60%,#b5d6f5)}
footer .quote{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(42px,5.6vw,80px);font-weight:400;color:var(--navy);line-height:1.25}
footer .zh{font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);font-weight:900;margin-top:18px;color:var(--navy);letter-spacing:.04em}
footer .logo{width:min(340px,80%);margin:52px auto 28px;background:#fff;padding:18px 22px;border-radius:24px;box-shadow:0 20px 50px -24px rgba(27,47,74,.45)}
footer .contact{display:flex;justify-content:center;gap:10px 40px;flex-wrap:wrap;font-size:clamp(19px,1.8vw,23px);font-weight:500;color:var(--navy)}
footer .contact b{color:var(--sky-700);font-weight:700;margin-right:6px}
footer .line-box{display:flex;align-items:center;gap:28px;max-width:760px;margin:34px auto 0;padding:20px 24px;text-align:left}
footer .line-box img{width:300px;height:auto;flex:none;border-radius:16px;box-shadow:0 14px 30px -16px rgba(27,47,74,.5)}
footer .line-box b{font-family:var(--serif);font-size:22px;color:#06a54a}
footer .line-box p{font-size:17.5px;color:var(--muted);margin:6px 0 12px}
footer .line-box .btn{padding:9px 20px;font-size:17.5px}
@media(max-width:700px){footer .line-box{flex-direction:column;text-align:center}footer .line-box img{width:min(320px,100%)}}
footer .copy{margin-top:36px;font-size:16px;color:var(--muted)}

.js .fade{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.js .fade.in{opacity:1;transform:none}
</style>
<style>
.cd-wrap{max-width:1080px;margin:0 auto;padding:118px 20px 80px}
.cd-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0;overflow:hidden;padding:0}
.cd-card .cimg{min-height:100%}
.cd-card .cbody{padding:34px 34px 36px}
.cd-card h3{font-size:30px}
.cd-card .sum{white-space:pre-line;font-size:18px;line-height:1.9}
.cd-msg{text-align:center;padding:80px 0;font-size:20px;color:var(--muted)}
.cd-back{margin-top:28px}
@media(max-width:820px){.cd-card{grid-template-columns:1fr}.cd-card .cbody{padding:24px}.cd-card h3{font-size:24px}}
</style>
</head>
<body>
<nav class="nav" id="nav" style="position:fixed;top:0;left:0;right:0"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px">
  <a class="brand" href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit"><img src="assets/mark.png" alt="" style="height:44px"><b style="font-family:var(--serif);font-size:18px">中華希望之門文化協會</b></a>
  <a class="btn btn-ghost" href="index.html#courses" style="padding:10px 20px;font-size:16px">回首頁</a>
</div></nav>
<main class="cd-wrap" id="root"><p class="cd-msg">課程資料載入中…</p></main>
<script src="config.js"></script>
<script>
(function(){
const CFG = window.HOPEGATE_CONFIG || {};
const PROGRAM = { women:{label:'婦女 AI 培訓', c:'var(--women)'}, family:{label:'親子友愛', c:'var(--family)'}, kids:{label:'兒童潛能', c:'var(--kids)'}, other:{label:'協會活動', c:'var(--sky-700)'} };
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const safeUrl = u => { if (!u) return ''; try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch(e) { return ''; } };
const root = document.getElementById('root');
const msg = t => { root.textContent = ''; root.appendChild(el('p', 'cd-msg', t)); };

const id = new URLSearchParams(location.search).get('id') || '';
if (!/^[0-9a-f-]{36}$/i.test(id)) { msg('找不到這門課程。'); return; }
if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) { msg('網站設定尚未完成，請稍後再試。'); return; }
const headers = /^eyJ/.test(CFG.supabaseAnonKey) ? { apikey:CFG.supabaseAnonKey, Authorization:'Bearer ' + CFG.supabaseAnonKey } : { apikey:CFG.supabaseAnonKey };

fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/hg_courses?select=*&published=eq.true&id=eq.' + encodeURIComponent(id), { headers })
  .then(r => r.json())
  .then(rows => {
    const c = rows && rows[0];
    if (!c) { msg('找不到這門課程，可能已經下架。'); return; }
    document.title = (c.title || '課程說明') + '｜中華希望之門文化協會';
    render(c);
  })
  .catch(() => msg('課程資料暫時無法載入，請稍後再試。'));

function render(c){
  const p = PROGRAM[c.program] || PROGRAM.other;
  const closed = /額滿|結束/.test(c.status || '');
  root.textContent = '';
  const card = el('article', 'course glass cd-card'); card.style.setProperty('--c', p.c);
  const im = el('div', 'cimg');
  const src = safeUrl(c.image_url || '');
  if (src) { const img = el('img'); img.src = src; img.alt = c.title || ''; im.appendChild(img); }
  im.appendChild(el('span', 'badge', p.label));
  if (c.status) im.appendChild(el('span', 'status' + (closed ? ' off' : ''), c.status));
  card.appendChild(im);

  const b = el('div', 'cbody');
  b.appendChild(el('h3', '', c.title || ''));
  const meta = el('div', 'meta');
  if (c.date_text) meta.appendChild(el('span', '', '日期｜' + c.date_text));
  if (c.location) meta.appendChild(el('span', '', '地點｜' + c.location));
  if (meta.childNodes.length) b.appendChild(meta);
  if (c.summary) b.appendChild(el('p', 'sum', c.summary));

  const f = el('div', 'cfoot');
  if (!closed) {
    const link = safeUrl(c.signup_url || '');
    const a = el('a', 'btn btn-gold', link ? '我要報名 →' : '洽詢與報名 →');
    a.href = link || 'index.html#signup';
    if (link) { a.target = '_blank'; a.rel = 'noopener'; }
    f.appendChild(a);
  }
  b.appendChild(f);
  card.appendChild(b);
  root.appendChild(card);
  const back = el('div', 'cd-back'); const bl = el('a', 'btn btn-ghost', '← 回課程與活動'); bl.href = 'index.html#courses'; back.appendChild(bl);
  root.appendChild(back);
}
})();
</script>
</body>
</html>
